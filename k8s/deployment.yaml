apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-springboot-project
  labels:
    app: devops-springboot-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-springboot-project
  template:
    metadata:
      labels:
        app: devops-springboot-project
    spec:
      containers:
      - name: devops-springboot-project
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
